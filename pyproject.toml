[project]
name = "multi-harness-rl-governed-agents"
version = "0.1.0"
description = "Multi-harness RL for agents that write to a system of record, behind a fail-closed write gate."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Bernardo Saab" }]
keywords = ["reinforcement-learning", "llm-agents", "grpo", "lora", "agent-harness", "evals"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["rich>=13.7"]

[project.optional-dependencies]
train = [
    "torch>=2.5",
    "transformers>=4.51",
    "peft>=0.14",
    "accelerate>=1.2",
]
report = ["matplotlib>=3.9"]

[project.scripts]
mhrl = "mhrl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mhrl"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "N818", "PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/mhrl"]

[[tool.mypy.overrides]]
module = ["mhrl.policies.hf", "mhrl.training.*", "mhrl.eval.report"]
disallow_untyped_calls = false
disable_error_code = ["arg-type"]
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "peft.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gpu: needs torch + transformers (skipped when unavailable)"]
