<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 234" width="720" height="234" role="img" aria-label="Tokens spent per accepted output (seen harnesses; failures and retries included)">

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --grid:#e4e3df;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#3a3936;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
  }
  text { font: 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         fill: var(--ink2); }
  .title { font-size: 14px; font-weight: 600; fill: var(--ink); }
  .label { fill: var(--ink); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .ci { stroke: var(--ink2); stroke-width: 1.5; }
  .bg { fill: var(--surface); }
</style>

<rect class="bg" width="720" height="234" rx="8"/>
<text class="title" x="16" y="24">Tokens spent per accepted output (seen harnesses; failures and retries included)</text>
<line class="grid" x1="150.0" x2="150.0" y1="52" y2="212"/>
<text x="150.0" y="226" text-anchor="middle">0</text>
<line class="grid" x1="275.0" x2="275.0" y1="52" y2="212"/>
<text x="275.0" y="226" text-anchor="middle">2,250</text>
<line class="grid" x1="400.0" x2="400.0" y1="52" y2="212"/>
<text x="400.0" y="226" text-anchor="middle">4,500</text>
<line class="grid" x1="525.0" x2="525.0" y1="52" y2="212"/>
<text x="525.0" y="226" text-anchor="middle">6,750</text>
<line class="grid" x1="650.0" x2="650.0" y1="52" y2="212"/>
<text x="650.0" y="226" text-anchor="middle">9,000</text>
<text class="label" x="140" y="68.0" text-anchor="end">Compiled loop</text>
<g><title>0 tokens per accepted output</title><rect x="150" y="58" width="2.0" height="12" rx="3" fill="var(--s1)"/>
<rect x="150" y="57" width="500" height="14" fill="transparent"/></g>
<text x="156.0" y="68">0 (no model)</text>
<text class="label" x="140" y="98.0" text-anchor="end">Base model</text>
<g><title>6,897 tokens per accepted output</title><rect x="150" y="88" width="383.1" height="12" rx="3" fill="var(--s1)"/>
<rect x="150" y="87" width="500" height="14" fill="transparent"/></g>
<text x="539.1" y="98">6,897</text>
<text class="label" x="140" y="128.0" text-anchor="end">Loop engineering</text>
<g><title>8,504 tokens per accepted output</title><rect x="150" y="118" width="472.5" height="12" rx="3" fill="var(--s1)"/>
<rect x="150" y="117" width="500" height="14" fill="transparent"/></g>
<text x="628.5" y="128">8,504</text>
<text class="label" x="140" y="158.0" text-anchor="end">Multi-harness RL</text>
<g><title>4,492 tokens per accepted output</title><rect x="150" y="148" width="249.5" height="12" rx="3" fill="var(--s1)"/>
<rect x="150" y="147" width="500" height="14" fill="transparent"/></g>
<text x="405.5" y="158">4,492</text>
<text class="label" x="140" y="188.0" text-anchor="end">Routed hybrid</text>
<g><title>2,256 tokens per accepted output</title><rect x="150" y="178" width="125.3" height="12" rx="3" fill="var(--s1)"/>
<rect x="150" y="177" width="500" height="14" fill="transparent"/></g>
<text x="281.3" y="188">2,256</text>
</svg>